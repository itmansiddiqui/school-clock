<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>School Clock</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    color: white;
}

#slideshow {
    position: fixed;
    inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transition: background-image 2s ease-in-out;
    z-index: 0;
}

#slideshow::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(11, 28, 45, 0.60);
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: url("school-logo.png") center no-repeat;
    background-size: 45%;
    opacity: 0.06;
    z-index: 1;
    pointer-events: none;
}

.container {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.time {
    font-size: clamp(90px, 15vw, 210px);
    font-weight: bold;
    letter-spacing: 2px;
    text-shadow: 0 4px 12px rgba(0,0,0,0.7);
}

.date {
    font-size: clamp(32px, 5vw, 60px);
    margin-top: 20px;
    text-shadow: 0 4px 12px rgba(0,0,0,0.7);
}
</style>
</head>

<body>

<div id="slideshow"></div>

<div class="container">
    <div class="time" id="time">00:00:00</div>
    <div class="date" id="date">Loading...</div>
</div>

<script>

// Use your exact uploaded filenames
const images = [
    "playground.jpg",
    "building.jpg",
    "lineup.jpg"
];

let currentImage = 0;
const slideshow = document.getElementById("slideshow");

function updateClock() {
    const now = new Date();

    const time = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Europe/London',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
    }).format(now);

    const date = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Europe/London',
        weekday: 'long',
        day: 'numeric',
        month: 'long',
        year: 'numeric'
    }).format(now);

    document.getElementById('time').textContent = time;
    document.getElementById('date').textContent = date;
}

function rotateBackground() {
    slideshow.style.backgroundImage =
        `url("${images[currentImage]}")`;

    currentImage = (currentImage + 1) % images.length;
}

updateClock();
rotateBackground();

setInterval(updateClock, 1000);
setInterval(rotateBackground, 15000);

</script>

</body>
</html>
